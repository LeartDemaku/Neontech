<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="none"/>
  
  <!-- Laptop Base -->
  <rect x="60" y="200" width="180" height="15" rx="5" fill="#2D2D2D" stroke="#00FFFF" stroke-width="3"/>
  
  <!-- Laptop Screen -->
  <path d="M70 120L70 195L230 195L230 120L70 120Z" fill="#1E1E1E" stroke="#FF00FF" stroke-width="3"/>
  
  <!-- Screen Content -->
  <rect x="80" y="130" width="140" height="55" rx="2" fill="none" stroke="#8A2BE2" stroke-width="1.5"/>
  
  <!-- Menu Bar -->
  <rect x="80" y="130" width="140" height="10" rx="2" fill="#8A2BE2"/>
  
  <!-- Window Controls -->
  <circle cx="85" cy="135" r="2" fill="#FF00FF"/>
  <circle cx="95" cy="135" r="2" fill="#00FFFF"/>
  <circle cx="105" cy="135" r="2" fill="#1E1E1E"/>
  
  <!-- Screen Content -->
  <rect x="85" y="145" width="60" height="5" rx="1" fill="#00FFFF"/>
  <rect x="85" y="155" width="130" height="3" rx="1" fill="#8A2BE2"/>
  <rect x="85" y="163" width="130" height="3" rx="1" fill="#8A2BE2"/>
  <rect x="85" y="171" width="130" height="3" rx="1" fill="#8A2BE2"/>
  <rect x="85" y="179" width="70" height="3" rx="1" fill="#8A2BE2"/>
  
  <!-- Laptop Keyboard Area -->
  <rect x="70" y="195" width="160" height="5" fill="#1E1E1E"/>
  
  <!-- Touchpad -->
  <rect x="115" y="205" width="70" height="5" rx="2" fill="#8A2BE2"/>
</svg> 