<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="none"/>
  
  <!-- Speaker Body -->
  <rect x="80" y="100" width="140" height="180" rx="15" fill="#2D2D2D" stroke="#00FFFF" stroke-width="4"/>
  
  <!-- Speaker Grill -->
  <rect x="100" y="120" width="100" height="120" rx="8" fill="#1E1E1E" stroke="#FF00FF" stroke-width="2"/>
  
  <!-- Grill Pattern -->
  <circle cx="150" cy="140" r="8" fill="none" stroke="#8A2BE2" stroke-width="1.5"/>
  <circle cx="150" cy="140" r="20" fill="none" stroke="#8A2BE2" stroke-width="1"/>
  <circle cx="150" cy="180" r="30" fill="none" stroke="#8A2BE2" stroke-width="1.5"/>
  <circle cx="150" cy="180" r="15" fill="none" stroke="#8A2BE2" stroke-width="1.5"/>
  
  <!-- Control Buttons -->
  <circle cx="150" cy="250" r="10" fill="#FF00FF"/>
  <rect x="120" y="245" width="15" height="10" rx="5" fill="#00FFFF"/>
  <rect x="165" y="245" width="15" height="10" rx="5" fill="#00FFFF"/>
  
  <!-- Led Indicator -->
  <circle cx="150" cy="80" r="5" fill="#8A2BE2"/>
  
  <!-- Sound Waves -->
  <path d="M230 150C240 150 250 150 260 150" stroke="#00FFFF" stroke-width="2"/>
  <path d="M230 170C245 170 260 170 275 170" stroke="#00FFFF" stroke-width="2"/>
  <path d="M230 130C245 130 260 130 275 130" stroke="#00FFFF" stroke-width="2"/>
</svg> 